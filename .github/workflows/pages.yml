name: Publicar KING no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Preparar site estático
        run: |
          rm -rf _site unpack
          mkdir -p unpack _site
          base64 -d king-public.zip.b64 > /tmp/king-public.zip
          unzip -q /tmp/king-public.zip -d unpack
          cp -R unpack/public/. _site/
          if [ -d overlay ]; then cp -R overlay/. _site/; fi
          if [ -f _site/cardinal.css ] && [ -f _site/index.html ]; then sed -i 's#</head>#<link rel="stylesheet" href="./cardinal.css?v=4"></head>#' _site/index.html; fi
          if [ -f _site/sw.js ]; then sed -i 's/king-v1/king-v4/g; s/king-v2/king-v4/g; s/king-v3/king-v4/g' _site/sw.js; fi
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Carregar artefacto Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
